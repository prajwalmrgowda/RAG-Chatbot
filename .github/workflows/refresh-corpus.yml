name: Refresh corpus

on:
  schedule:
    # GitHub cron uses UTC. This runs daily at 08:00 Asia/Kolkata.
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-corpus.yml"
      - "requirements-ingest.txt"
      - "seed_sources.csv"
      - "ingest.py"
      - "src/chunker.py"
      - "src/config.py"
      - "src/embedder.py"
      - "src/loader.py"
      - "src/store.py"
      - "src/corpus_snapshot.py"

permissions:
  contents: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: minilm-c9745ed1-linux

      - name: Install ingestion dependencies
        run: python -m pip install -r requirements-ingest.txt

      - name: Refresh approved sources
        env:
          TOKENIZERS_PARALLELISM: "false"
          ANONYMIZED_TELEMETRY: "false"
        run: |
          python -m src.corpus_snapshot restore --database data/chroma_db/
          python ingest.py --sources seed_sources.csv --output data/chroma_db/
          python -m src.corpus_snapshot export --database data/chroma_db/

      - name: Commit refreshed corpus
        run: |
          if git diff --quiet -- data/corpus.json.gz sources.csv; then
            echo "Corpus is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus.json.gz sources.csv
          git commit -m "Refresh daily source corpus"
          git push origin main
